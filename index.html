<script>
let score = 0;
let totaldice = 0;
let autoCount = 0;
let autoMin = 0.06;
let autoMax = 0.12;
let autoCost = 15;
let spinning = false;
let totalrolls = 0;
let Rollceptiongain = 1;
let RollceptionUnlocked = false;
let manualrollmin = 1;
let manualrollmax = 6;
let autorollmultiplier = 1;
let achievement100rolls = 0;
let achievement100rollsshownbefore = 0;
let achievement1000rolls = 0;
let achievement1000rollsshownbefore = 0;
let autoluckUnlocked = false;
let fasterrollersUnlocked = false;
let bautoluckUnlocked = false;
let comboUnlocked = false;
let firstdicesetcanget = false;
let d4Unlocked = false;
let d6Unlocked = false;
let d8Unlocked = false;
let d10Unlocked = false;
let d12Unlocked = false;
let d20Unlocked = false;
let combo = 1;
let critchance = 0.01;
let supercritchance = 0.001;
let critmultiplier = 4;
let supercritmultiplier = 16;
let currentcritmultiplier = 1;
let critted = false;
let supercritted = false;
let clicksuntildevmode = 10;
let devmode = false;
let diamondDiceActive = false;
let clickbuff = 0;
let clickbuffamnt = 1;
let dicetypesmultiplier = 1;


const diamondDice = document.getElementById("diamondDice");
const dice = document.getElementById("dice");
updateDisplay();

// DICE CLICK
dice.onclick = function() {
    if (spinning) return;

    spinning = true;
    dice.classList.add("spinning");
    dice.textContent = "?";

    // Force a reflow so animation starts properly
    void dice.offsetWidth;

    setTimeout(() => {
        dice.classList.remove("spinning");

        // Reset manual roll range
        manualrollmin = 1;
        manualrollmax = 6;

        // Calculate roll
        let roll;

        if (comboUnlocked) {
            combo += 0.1;
        }

        let rand = Math.random();

        if (rand < supercritchance) {
            currentcritmultiplier = supercritmultiplier;
            critted = false;
            supercritted = true;
        } 
            else if (rand < critchance) {
                currentcritmultiplier = critmultiplier;
                supercritted = false;
                critted = true;
            } 
                else {
                    currentcritmultiplier = 1;
                    critted = false;
                    supercritted = false;
                }

        if (RollceptionUnlocked) {
            Rollceptiongain = totalrolls * 0.001 + 1;
            roll = (Math.floor(Math.random() * 6) + 1) * Rollceptiongain;
            manualrollmin *= Rollceptiongain * combo * clickbuffamnt * dicetypesmultiplier;
            manualrollmax *= Rollceptiongain * combo * clickbuffamnt * dicetypesmultiplier;
            } else {
                roll = Math.floor(Math.random() * 6) + 1;
                manualrollmin *= combo * clickbuffamnt * dicetypesmultiplier;
                manualrollmax *= combo * clickbuffamnt * dicetypesmultiplier;
            }
        
        roll = roll * combo * currentcritmultiplier * clickbuffamnt * dicetypesmultiplier;

        roll = Math.round(roll * 100) / 100;
        dice.textContent = roll;

        score += roll;
        totaldice += roll;
        totalrolls += 1;

        document.body.classList.remove("shake", "bigshake");

        if (supercritted) {
            showFloatingNumber(roll, critted, supercritted)
            document.body.classList.add("bigshake");

            setTimeout(() => {
                document.body.classList.remove("bigshake");
            }, 400);

            } else if (critted) {
                showFloatingNumber(roll, critted, supercritted)
                document.body.classList.add("shake");

                setTimeout(() => {
                    document.body.classList.remove("shake");
                }, 400);
        } else {
            showFloatingNumber(roll);
        }

        if (!achievement100rolls && totalrolls >= 100) {
            achievement100rolls = 1;
        }
        if (!achievement1000rolls && totalrolls >= 1000) {
            achievement1000rolls = 1;
        }
        spinning = false;
        updateDisplay();
    }, 800); // this 800ms is how long the animation runs
};

// Buy an auto dice generator
function buyAuto() {
    if (score >= autoCost) {
        score -= autoCost;
        autoCost = Math.floor(autoCost * 1.3);
        autoCount++;
        updateDisplay();
    }
}

function buyrollception() {
    if (score >= 250) {
        score -= 250;
        RollceptionUnlocked = true;
        updateDisplay();
    }
}

function buycombo() {
    if (score >= 100000) {
        score -= 100000;
        comboUnlocked = true;
        updateDisplay();
    }
}


function buyautoluck() {
    if (score >= 100) {
        score -= 100;
        autorollmultiplier *= 2;
        autoluckUnlocked = true;
        updateDisplay();
    }
}

function buyfasterrollers() {
    if (score >= 500) {
        score -= 500;
        autorollmultiplier *= 2;
        fasterrollersUnlocked = true;
        updateDisplay();
    }
}

function buybautoluck() {
    if (score >= 10000) {
        score -= 10000;
        autoMin += 0.02;
        bautoluckUnlocked = true;
        updateDisplay();
    }
}

function buyd4() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d4Unlocked = true;
        updateDisplay();
    }
}
function buyd6() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d6Unlocked = true;
        updateDisplay();
    }
}
function buyd8() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d8Unlocked = true;
        updateDisplay();
    }
}
function buyd10() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d10Unlocked = true;
        updateDisplay();
    }
}
function buyd12() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d12Unlocked = true;
        updateDisplay();
    }
}
function buyd20() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d20Unlocked = true;
        updateDisplay();
    }
}

// DPS INCOME
setInterval(function() {
    if (autoCount > 0) {
        let totalMin = autoMin * autoCount * autorollmultiplier * dicetypesmultiplier;
        let totalMax = autoMax * autoCount * autorollmultiplier * dicetypesmultiplier;
        let gain = Math.random() * (totalMax - totalMin) + totalMin;

        score += gain;
        totaldice += gain;
        updateDisplay();
    }
}, 1000);

setInterval(function() {
    if (comboUnlocked && combo > 1) {
        combo -= 0.05;
        if (combo < 1) combo = 1; // clamp to 1 minimum
        manualrollmin = 1
        manualrollmax = 6
        if (RollceptionUnlocked) {
            Rollceptiongain = totalrolls * 0.001 + 1;
            manualrollmin *= Rollceptiongain * combo;
            manualrollmax *= Rollceptiongain * combo;
        } else {
            manualrollmin *= combo;
            manualrollmax *= combo;
        }
        updateDisplay();          // update immediately so UI shows it dropping
    }
    if (clickbuff > 0) {
        clickbuff -= 1
    } else {
        clickbuffamnt = 1
    }
}, 1000);

function hideach100rolls() {
    document.getElementById("ach100rolls").hidden = true;
}

function hideach1000rolls() {
    document.getElementById("ach1000rolls").hidden = true;
}

function formatNumber(num) {

    const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];

    if (num < 1000) return num.toFixed(2);

    let tier = Math.floor(Math.log10(num) / 3);

    // If within suffix list
    if (tier < suffixes.length) {
        let scale = Math.pow(10, tier * 3);
        let scaled = num / scale;
        return scaled.toFixed(2) + suffixes[tier];
    }

    // If number is insanely big → scientific notation
    return num.toExponential(2);
}

function showFloatingNumber(value, isCrit, isSuperCrit) {
    const number = document.createElement("div");
    number.classList.add("floating-number");
    
    if (isSuperCrit) number.classList.add("supercrit");
    else if (isCrit) number.classList.add("crit");
    
    number.textContent = value;

    // Position near the dice
    const diceRect = dice.getBoundingClientRect();
    number.style.left = (diceRect.left + diceRect.width / 2) + "px";
    number.style.top = diceRect.top + "px";

    document.body.appendChild(number);

    // Animate float up
    requestAnimationFrame(() => {
        number.style.transform = "translateY(-60px)";
        number.style.opacity = 0;
    });

    // Remove after animation
    setTimeout(() => number.remove(), 800);
}

function lowerdevmodeclick() {
    clicksuntildevmode -= 1
    if (clicksuntildevmode <= 0) {
        devmode = true
        alert("Test mode enabled!")
        console.log("Test mode enabled!")
        updateDisplay()
    }
}

function devmodeget5autorollers() {
    autoCount += 5
    autoCost = Math.floor(autoCost * 3.71293);
    updateDisplay()
}

setInterval(function() {

    if (diamondDiceActive) return;

    if (Math.random() < 0.05) { // 5% chance every 10 seconds
        spawnDiamondDice();
    }

}, 10000);


function spawnDiamondDice() {

    diamondDiceActive = true;

    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 100);

    diamondDice.style.left = x + "px";
    diamondDice.style.top = y + "px";

    diamondDice.hidden = false;

    // disappear after 8 seconds
    setTimeout(() => {
        diamondDice.hidden = true;
        diamondDiceActive = false;
    }, 8000);

}

diamondDice.onclick = function() {

    diamondDice.hidden = true;
    diamondDiceActive = false;

    let reward = Math.floor(Math.random() * 5);

    if (reward === 0) {
        score += (totaldice / 100) * 15;
        alert("💎 Lucky! +" + Math.floor((totaldice / 100) * 15) + " Dice");
    }

    else if (reward === 1) {
        autoCount += 1;
        alert("💎 Free Autoroller!");
        autocost = Math.floor(autoCost * 1.3);
    }

    else if (reward === 2) {
        clickbuff += 60;
        clickbuffamnt = 2;
        alert("💎 Click buff! x2 for 60 seconds!");
    }

    else if (reward === 3) {
        clickbuff += 5
        clickbuffamnt += 777;
        alert("💎Lottery win! x777 clicks for 5 seconds!")
    }

    else {
        score *= 2;
        alert("💎 Dice Doubled!");
    }

    updateDisplay();
};

function showTooltip(event, title, desc, cost){

const tooltip = document.getElementById("tooltip");

tooltip.style.display = "block";

tooltip.innerHTML =
"<b>" + title + "</b><br>" +
desc + "<br>" +
"<i>" + cost + "</i>";

tooltip.style.left = event.clientX + 15 + "px";
tooltip.style.top = event.clientY + 15 + "px";

}

function hideTooltip(){
document.getElementById("tooltip").style.display = "none";
}

function updateUpgradeAffordability(){

const upgrades = document.querySelectorAll(".upgradeBox");

upgrades.forEach(upgrade => {

let cost = Number(upgrade.dataset.cost);

if(score >= cost){
upgrade.classList.add("affordable");
}else{
upgrade.classList.remove("affordable");
}

});

}

function updateDisplay() {
    document.getElementById("score").textContent = formatNumber(score);
    document.getElementById("autoCount").textContent = autoCount;
    document.getElementById("autoCost").textContent = formatNumber(autoCost);
    document.getElementById("autorollmultiplier").textContent = ("x" + formatNumber(autorollmultiplier));
    document.getElementById("rollceptiongain").textContent = ("x" + formatNumber(Rollceptiongain));
    document.getElementById("totalrolls").textContent = formatNumber(totalrolls);
    document.getElementById("dicetypesmultiplier").textContent = ("x" + formatNumber(dicetypesmultiplier));
    document.getElementById("totalrollmultiplier").textContent = ("x" + formatNumber(currentcritmultiplier * combo * dicetypesmultiplier * Rollceptiongain));
    document.getElementById("totalautomultiplier").textContent = ("x" + formatNumber(autorollmultiplier * dicetypesmultiplier));
    document.addEventListener("mousemove", function(e){
        const tooltip = document.getElementById("tooltip");
        tooltip.style.left = e.clientX + 15 + "px";
        tooltip.style.top = e.clientY + 15 + "px";
    });
    if (score >= 500) {
        firstdicesetcanget = true;
    }
    if (comboUnlocked) {
    document.getElementById("combogain").textContent = ("x" + formatNumber(combo));
    }
    document.title = formatNumber(score) + " Dice in Dice clicker";

    let totalMin = (autoMin * autoCount) * autorollmultiplier;
    let totalMax = (autoMax * autoCount) * autorollmultiplier;
    document.getElementById("autoRate").textContent = totalMin + " - " + totalMax;
    document.getElementById("min-maxmanual").textContent = formatNumber(manualrollmin) + " - " + formatNumber(manualrollmax) + " per roll";
    if (achievement100rolls && !RollceptionUnlocked) {
        document.getElementById("rollception").hidden = false;
    } else {
        document.getElementById("rollception").hidden = true;
    }
    if (autoCount >= 1 && !autoluckUnlocked) {
