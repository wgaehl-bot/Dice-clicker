<!DOCTYPE html>
<html>
<head>
    <title>Dice clicker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #222;
            color: white;
        }

        #dice {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            background: white;
            color: black;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 15px;
            user-select: none;
        }

        /* DICE ANIMATION SPEED not speed just how fast it spins */
        .spinning {
            animation: spin 0.4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .box {
            margin: 15px;
        }

.shake {

}

@keyframes shake {
    0% { transform: translate(0px, 0px); }
    25% { transform: translate(-5px, 5px); }
    50% { transform: translate(5px, -5px); }
    75% { transform: translate(-5px, -5px); }
    100% { transform: translate(0px, 0px); }
}

    0% { transform: translate(0px, 0px); }
    25% { transform: translate(-20px, 20px); }
    50% { transform: translate(20px, -20px); }

<script>
let score = 0;
let totaldice = 0;
let autoCount = 0;
let dicegoblinCount = 0;
let autoMin = 0.06;
let dicegoblinMin = 0.8;
let autoMax = 0.12;
let dicegoblinMax = 1.6;
let autoCost = 15;
let dicegoblinCost = 200;
let spinning = false;
let totalrolls = 0;
let Rollceptiongain = 1;
let RollceptionUnlocked = false;
let manualrollmin = 1;
let manualrollmax = 6;
let autorollmultiplier = 1;
let achievement100rolls = 0;
let achievement100rollsshownbefore = 0;
let achievement1000rolls = 0;
let achievement1000rollsshownbefore = 0;
let autoluckUnlocked = false;
let fasterrollersUnlocked = false;
let bautoluckUnlocked = false;
let comboUnlocked = false;
let firstdicesetcanget = false;
let d4Unlocked = false;
let d6Unlocked = false;
let d8Unlocked = false;
let d10Unlocked = false;
let d12Unlocked = false;
let d20Unlocked = false;
let combo = 1;
let critchance = 0.01;
let supercritchance = 0.001;
let critmultiplier = 4;
let supercritmultiplier = 16;
let currentcritmultiplier = 1;
let critted = false;
let supercritted = false;
let clicksuntildevmode = 25;
let devmode = false;
let diamondDiceActive = false;
let clickbuff = 0;
let clickbuffamnt = 1;
let dicetypesmultiplier = 1;
let timeflux = 0;
let timefluxmax = 3600; // 1 hour max timeflux (base)
let timefluxgain = 1; // timeflux gain per minute (base)
let offlinetimefluxgain = 0.5; // timeflux gain per minute while offline (base)
let tfcost = 3;
let otfcost = 2;
let tfmaxcost = 4;
let timefluxmultiplier = 1;
let prestigeGain = 1;
let prestigeMult = 1;

const diamondDice = document.getElementById("diamondDice");
const dice = document.getElementById("dice");
updateDisplay();

document.addEventListener("mousemove", function(e){
        const tooltip = document.getElementById("tooltip");
        tooltip.style.left = e.clientX + 15 + "px";
        tooltip.style.top = e.clientY + 15 + "px";
    });

function resetsave() {
    localStorage.removeItem("diceClickerSave")
    score = 0;
    totaldice = 0;
    autoCount = 0;
    dicegoblinCount = 0;
    autoMin = 0.06;
    dicegoblinMin = 0.8;
    autoMax = 0.12;
    dicegoblinMax = 1.6;
    autoCost = 15;
    dicegoblinCost = 200;
    spinning = false;
    totalrolls = 0;
    Rollceptiongain = 1;
    RollceptionUnlocked = false;
    manualrollmin = 1;
    manualrollmax = 6;
    autorollmultiplier = 1;
    achievement100rolls = 0;
    achievement100rollsshownbefore = 0;
    achievement1000rolls = 0;
    achievement1000rollsshownbefore = 0;
    autoluckUnlocked = false;
    fasterrollersUnlocked = false;
    bautoluckUnlocked = false;
    comboUnlocked = false;
    firstdicesetcanget = false;
    d4Unlocked = false;
    d6Unlocked = false;
    d8Unlocked = false;
    d10Unlocked = false;
    d12Unlocked = false;
    d20Unlocked = false;
    combo = 1;
    critchance = 0.01;
    supercritchance = 0.001;
    critmultiplier = 4;
    supercritmultiplier = 16;
    currentcritmultiplier = 1;
    critted = false;
    supercritted = false;
    clicksuntildevmode = 25;
    devmode = false;
    diamondDiceActive = false;
    clickbuff = 0;
    clickbuffamnt = 1;
    dicetypesmultiplier = 1;
    timeflux = 0;
    timefluxmax = 3600;
    timefluxgain = 1;
    offlinetimefluxgain = 0.5;
    tfcost = 3;
    otfcost = 2;
    tfmaxcost = 4;
    timefluxmultiplier = 1;
    prestigeGain = 1;
    prestigeMult = 1;
}

// DICE CLICK
dice.onclick = function() {
    if (spinning) return;

    spinning = true;
    dice.classList.add("spinning");
    dice.textContent = "?";

    // Force a reflow so animation starts properly
    void dice.offsetWidth;

    setTimeout(() => {
        dice.classList.remove("spinning");

        // Reset manual roll range
        manualrollmin = 1;
        manualrollmax = 6;

        // Calculate roll
        let roll;

        if (comboUnlocked) {
            combo += 0.1;
        }

        let rand = Math.random();

        if (rand < supercritchance) {
            currentcritmultiplier = supercritmultiplier;
            critted = false;
            supercritted = true;
        } 
            else if (rand < critchance) {
                currentcritmultiplier = critmultiplier;
                supercritted = false;
                critted = true;
            } 
                else {
                    currentcritmultiplier = 1;
                    critted = false;
                    supercritted = false;
                }

        if (RollceptionUnlocked) {
            Rollceptiongain = totalrolls * 0.001 + 1;
            roll = (Math.floor(Math.random() * 6) + 1) * Rollceptiongain;
            manualrollmin *= Rollceptiongain * combo * clickbuffamnt * dicetypesmultiplier * prestigeMult;
            manualrollmax *= Rollceptiongain * combo * clickbuffamnt * dicetypesmultiplier * prestigeMult;
            } else {
                roll = Math.floor(Math.random() * 6) + 1;
                manualrollmin *= combo * clickbuffamnt * dicetypesmultiplier * prestigeMult;
                manualrollmax *= combo * clickbuffamnt * dicetypesmultiplier * prestigeMult;
            }
        
        roll = roll * combo * currentcritmultiplier * clickbuffamnt * dicetypesmultiplier * prestigeMult;

        roll = Math.round(roll * 100) / 100;
        dice.textContent = roll;

        score += roll;
        totaldice += roll;
        totalrolls += 1;

        dice.classList.remove("shake", "bigshake");

        if (supercritted) {
            showFloatingNumber(roll, critted, supercritted)
            dice.classList.add("bigshake");

            setTimeout(() => {
                dice.classList.remove("bigshake");
            }, (400 / timefluxmultiplier));

            } else if (critted) {
                showFloatingNumber(roll, critted, supercritted)
                dice.classList.add("shake");

                setTimeout(() => {
                    dice.classList.remove("shake");
                }, (400 / timefluxmultiplier));
        } else {
            showFloatingNumber(roll);
        }

        if (!achievement100rolls && totalrolls >= 100) {
            achievement100rolls = 1;
        }
        if (!achievement1000rolls && totalrolls >= 1000) {
            achievement1000rolls = 1;
        }
        spinning = false;
        updateDisplay();
    }, (800 / timefluxmultiplier)); // this 800ms is how long the animation runs
};

// Buy an auto dice generator
function buyAuto() {
    if (score >= autoCost) {
        score -= autoCost;
        autoCost = Math.floor(autoCost * 1.3);
        autoCount++;
        updateDisplay();
    }
}

function buyDiceGoblin() {
    if (score >= dicegoblinCost) {
        score -= dicegoblinCost;
        dicegoblinCost = Math.floor(dicegoblinCost * 1.3);
        dicegoblinCount++;
        updateDisplay();
    }
}

function buyrollception() {
    if (score >= 250) {
        score -= 250;
        RollceptionUnlocked = true;
        updateDisplay();
    }
}

function buycombo() {
    if (score >= 100000) {
        score -= 100000;
        comboUnlocked = true;
        updateDisplay();
    }
}


function buyautoluck() {
    if (score >= 100) {
        score -= 100;
        autorollmultiplier *= 2;
        autoluckUnlocked = true;
        updateDisplay();
    }
}

function buyfasterrollers() {
    if (score >= 500) {
        score -= 500;
        autorollmultiplier *= 2;
        fasterrollersUnlocked = true;
        updateDisplay();
    }
}

function buybautoluck() {
    if (score >= 10000) {
        score -= 10000;
        autoMin += 0.02;
        bautoluckUnlocked = true;
        updateDisplay();
    }
}

function buyd4() {
    if (score >= 1000) {
        score -= 1000;
        dicetypesmultiplier *= 1.01;
        d4Unlocked = true;
        updateDisplay();
    }
}
function buyd6() {

}
function buyd8() {

function buyd10() {
    if (score >= 1000) {

        dicetypesmultiplier *= 1.01;

function formatNumber(num) {

    const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];

    if (num < 1000) return num.toFixed(2);

    let tier = Math.floor(Math.log10(num) / 3);

    // If within suffix list
    if (tier < suffixes.length) {
        let scale = Math.pow(10, tier * 3);
        let scaled = num / scale;
        return scaled.toFixed(2) + suffixes[tier];
    }

    // If number is insanely big → scientific notation
    return num.toExponential(2);
}

    number.style.left = (diceRect.left + diceRect.width / 2) + "px";
    number.style.top = diceRect.top + "px";

    document.body.appendChild(number);

    // Animate float up
    requestAnimationFrame(() => {
        number.style.transform = "translateY(-60px)";
