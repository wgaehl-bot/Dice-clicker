        #dice {
            width: 120px;
            height: 120px;
            margin: 20px auto;
            background: white;
            color: black;
            font-size: 40px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border-radius: 15px;
            user-select: none;
        }

        /* DICE ANIMATION SPEED not speed just how fast it spins */
        .spinning {
            animation: spin 0.4s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }

        .box {
            margin: 15px;
        }
    </style>

<style>
#dice{
    font-size: 4vh;
}
.invisibleButton {
    background: none;
    border: none;
    padding: 0;
    margin: 0;
    color: inherit;
    font: inherit;
    cursor: pointer;
}
#achievementGrid {
    display: grid;
    grid-template-columns: repeat(6, 60px);
    gap: 10px;
    justify-content: center;
}
.locked {
    filter: grayscale(100%);
    opacity: 0.4;
}
.achievement {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: gold;
    padding: 10px 20px;
    z-index: 1000;
}
.achievement2 {
    width: 60px;
    height: 60px;
    background: #444;
    border-radius: 8px;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}
#menuToggle {
    position: absolute;
    top: -25px;
    left: 10px;
    font-size: 12px;
}
.multipliers {
    position: fixed;  /* keeps it in the same place even when scrolling */
    top: 10px;
    left: 10px;       /* distance from left */
    background: lightblue; /* optional styling */
    padding: 5px;
    border-radius: 5px;
    z-index: 1000;    /* makes it appear above other elements */
}
.resetsave {
    position: fixed;  /* keeps it in the same place even when scrolling */
    bottom: 10px;
    left: 10px;       /* distance from left */
    background: lightblue; /* optional styling */
    padding: 5px;
    border-radius: 5px;
    z-index: 1000;    /* makes it appear above other elements */
}

function formatNumber(num) {

    const suffixes = ["", "K", "M", "B", "T", "Qa", "Qi", "Sx", "Sp", "Oc", "No", "Dc"];

    if (num < 1000) return num.toFixed(2);

    let tier = Math.floor(Math.log10(num) / 3);

    // If within suffix list
    if (tier < suffixes.length) {
        let scale = Math.pow(10, tier * 3);
        let scaled = num / scale;
        return scaled.toFixed(1) + suffixes[tier];
    }

    // If number is insanely big → scientific notation
    return num.toExponential(2);
}

function showFloatingNumber(value, isCrit, isSuperCrit) {

    number.textContent = formatNumber(value);

    // Position near the dice
    const diceRect = dice.getBoundingClientRect();
    number.style.left = (diceRect.left + diceRect.width / 2) + "px";
    number.style.top = diceRect.top + "px";

    document.body.appendChild(number);

    // Animate float up
    requestAnimationFrame(() => {
        number.style.transform = "translateY(-60px)";

}
